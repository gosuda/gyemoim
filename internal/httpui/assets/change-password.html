<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>Set a new password · Gyemoim</title>
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="panel form-panel auth-panel">
      <div class="card-heading auth-heading">
        <div class="card-icon" aria-hidden="true">G</div>
        <div><h1>Set a new password</h1><p class="muted">You must change your password before using Gyemoim.</p></div>
      </div>
      <p class="muted" id="change-password-user" hidden></p>
      <form id="change-password-form" class="stack-form">
        <label for="change-current-password">Current password</label>
        <input id="change-current-password" name="currentPassword" type="password" autocomplete="current-password" required autofocus aria-describedby="change-current-hint">
        <p class="muted" id="change-current-hint">This is the temporary password you were given.</p>
        <label for="change-new-password">New password</label>
        <input id="change-new-password" name="newPassword" type="password" autocomplete="new-password" required>
        <label for="change-confirm-password">Repeat new password</label>
        <input id="change-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
        <p class="muted">Other signed-in sessions are signed out when you set the new password.</p>
        <button class="button primary" type="submit">Set a new password</button>
        <p class="form-message" id="change-password-message" role="status" aria-live="polite"></p>
      </form>
      <p class="muted">Wrong account? <button class="link-button" type="button" id="change-password-signout">Sign out</button></p>
    </section>
  </main>
</body>
</html>
